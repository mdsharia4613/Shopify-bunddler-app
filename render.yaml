services:
  - type: web
    name: smart-bundle-app
    env: node
    plan: free
    region: oregon
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npm run setup && npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: SCOPES
        value: write_metaobject_definitions,write_metaobjects,write_products,write_cart_transforms,read_cart_transforms,write_discounts,read_discounts
      - key: SHOPIFY_API_KEY
        sync: false
      - key: SHOPIFY_API_SECRET
        sync: false
      - key: SHOPIFY_APP_URL
        sync: false
